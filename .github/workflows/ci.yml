name: PR checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# Serialize production runs; newer PR revisions can cancel older checks.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test changelog
        run: node --test scripts/*.test.mjs

      - name: Build
        run: npm run build

